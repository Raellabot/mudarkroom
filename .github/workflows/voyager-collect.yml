name: Voyager collect

# Run by hand: copies a Voyager run's artifacts onto their own branch (voyager-out-<run id>) so they can be fetched with git.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run id whose artifacts to collect"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: out
      - name: Push to a branch of its own
        env:
          RUN: ${{ inputs.run_id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          echo "$RUN" | grep -Eq '^[0-9]+$'
          cd out
          git init -q -b "voyager-out-$RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Artifacts of run $RUN"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${REPO}.git" "voyager-out-$RUN"
