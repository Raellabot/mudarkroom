name: Orion probe

# Run by hand: lists the Hubble (MAST) and Spitzer (IRSA) products around the Orion Nebula; the report is the run's artifact.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install astropy astroquery numpy pyvo
      - run: python -u scripts/orion/probe.py out 2>&1 | tee probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: orion-probe
          path: |
            out
            probe.log
